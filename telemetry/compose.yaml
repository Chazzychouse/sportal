name: sportal-telemetry

services:
  lgtm:
    image: grafana/otel-lgtm:0.35.0
    ports:
      - 127.0.0.1:3000:3000
      - 127.0.0.1:4318:4318
    volumes:
      - lgtm-data:/data
      - ./dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/sportal.yaml:ro
      - ./dashboards:/var/lib/sportal-dashboards:ro

volumes:
  lgtm-data:
